<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECBusiness - Gestão Completa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        #mobileSidebar { transition: transform 0.3s ease-in-out; transform: translateX(-100%); }
        #mobileSidebar.open { transform: translateX(0); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div id="loginPage" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border">
            <h1 class="text-2xl font-bold text-blue-600 mb-6 text-center">EC Business</h1>
            <input type="email" id="loginEmail" class="w-full p-3 mb-3 border rounded-lg" placeholder="E-mail">
            <input type="password" id="loginPass" class="w-full p-3 mb-4 border rounded-lg" placeholder="Senha">
            <div class="flex items-center gap-2 mb-6">
                <input type="checkbox" id="rememberMe" class="w-4 h-4 text-blue-600 rounded">
                <label for="rememberMe" class="text-sm text-slate-600">Lembrar meus dados</label>
            </div>
            <button onclick="app.auth.login()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">Entrar</button>
        </div>
    </div>

    <div id="dashboard" class="hidden flex flex-col min-h-screen">
        <header class="bg-white p-4 flex justify-between items-center shadow-sm sticky top-0 z-30">
            <button onclick="document.getElementById('mobileSidebar').classList.add('open')" class="text-xl"><i class="fa-solid fa-bars"></i></button>
            <h1 class="font-bold text-slate-700" id="headerTitle">Empréstimos</h1>
            <div id="userBadge" class="w-8 h-8 bg-blue-600 rounded-full text-white flex items-center justify-center font-bold text-sm">U</div>
        </header>

        <aside id="mobileSidebar" class="fixed inset-y-0 left-0 w-72 bg-slate-900 text-white p-5 z-50">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-xl font-bold text-blue-400">EC Business</h2>
                <button onclick="document.getElementById('mobileSidebar').classList.remove('open')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <nav class="space-y-4">
                <button onclick="app.ui.nav('emprestimos')" class="block w-full text-left p-3 hover:bg-slate-800 rounded"><i class="fa-solid fa-hand-holding-dollar mr-3 text-blue-400"></i>Empréstimos</button>
                <button onclick="app.ui.nav('fornecedores')" class="block w-full text-left p-3 hover:bg-slate-800 rounded"><i class="fa-solid fa-truck mr-3 text-amber-400"></i>Fornecedores</button>
                <button onclick="app.ui.nav('usuarios')" id="menuUsuarios" class="hidden block w-full text-left p-3 hover:bg-red-900 text-red-300 rounded"><i class="fa-solid fa-users-gear mr-3"></i>Gerenciar Usuários</button>
                <button onclick="app.ui.nav('historico')" class="block w-full text-left p-3 hover:bg-slate-800 rounded"><i class="fa-solid fa-clock-rotate-left mr-3 text-emerald-400"></i>Histórico</button>
            </nav>
            <button onclick="location.reload()" class="absolute bottom-5 text-red-400 text-sm">Sair do Sistema</button>
        </aside>

        <main class="p-4 flex-1">
            <div id="content-emprestimos" class="tab-content active space-y-4">
                <div class="bg-white p-5 rounded-xl border shadow-sm">
                    <h3 class="font-bold mb-4 text-blue-700">Novo Empréstimo</h3>
                    <input type="text" id="loanClient" placeholder="Nome do Cliente" class="w-full p-2 mb-2 border rounded">
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <input type="number" id="loanValue" placeholder="Valor R$" class="p-2 border rounded" oninput="app.loans.calc()">
                        <input type="number" id="loanRate" placeholder="Juros %" class="p-2 border rounded" oninput="app.loans.calc()">
                    </div>
                    <div class="grid grid-cols-2 gap-2 mb-4">
                        <input type="number" id="loanDays" placeholder="Prazo (Dias)" class="p-2 border rounded">
                        <input type="text" id="loanWhats" placeholder="WhatsApp" class="p-2 border rounded">
                    </div>
                    <div class="bg-blue-50 p-3 rounded mb-4 font-bold text-blue-800">Total: R$ <span id="loanTotal">0,00</span></div>
                    <button onclick="app.loans.add()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">Cadastrar</button>
                </div>
                <div id="loanList" class="space-y-3 mt-6">
                    <p class="text-center text-slate-400 py-4">Carregando empréstimos...</p>
                </div>
            </div>

            <div id="content-fornecedores" class="tab-content space-y-4">
                <div class="bg-white p-5 rounded-xl border shadow-sm">
                    <h3 class="font-bold mb-4 text-amber-600">Novo Fornecedor</h3>
                    <input type="text" id="supName" placeholder="Nome" class="w-full p-2 mb-2 border rounded">
                    <input type="text" id="supWhats" placeholder="WhatsApp" class="w-full p-2 mb-2 border rounded">
                    <input type="text" id="supPix" placeholder="Chave Pix" class="w-full p-2 mb-2 border rounded">
                    <input type="number" id="supValue" placeholder="Valor Fornecido R$" class="w-full p-2 mb-4 border rounded">
                    <button onclick="app.suppliers.add()" class="w-full bg-amber-500 text-white py-3 rounded-lg font-bold">Salvar</button>
                </div>
                <div id="supList" class="space-y-3 mt-6">
                    <p class="text-center text-slate-400 py-4">Carregando fornecedores...</p>
                </div>
            </div>

            <div id="content-usuarios" class="tab-content space-y-4">
                <div class="bg-white p-5 rounded-xl border shadow-sm">
                    <h3 class="font-bold mb-4 text-red-600">Adicionar Usuário</h3>
                    <input type="text" id="newUserName" placeholder="Nome" class="w-full p-2 mb-2 border rounded">
                    <input type="email" id="newUserEmail" placeholder="E-mail" class="w-full p-2 mb-2 border rounded">
                    <input type="password" id="newUserPass" placeholder="Senha" class="w-full p-2 mb-2 border rounded">
                    <select id="newUserRole" class="w-full p-2 mb-4 border rounded">
                        <option value="comum">Usuário Comum</option>
                        <option value="admin">Administrador</option>
                    </select>
                    <button onclick="app.users.add()" class="w-full bg-red-600 text-white py-3 rounded-lg font-bold">Criar Acesso</button>
                </div>
                <div id="userList" class="space-y-2"></div>
            </div>

            <div id="content-historico" class="tab-content space-y-2">
                <h3 class="font-bold text-slate-600 mb-2">Logs de Atividade</h3>
                <div id="logList" class="space-y-2"></div>
            </div>
        </main>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB8Zo9q55deQdI-QtfHOSGqURXqvR8Mfn8",
            authDomain: "ecbusiness-app.firebaseapp.com",
            databaseURL: "https://ecbusiness-app-default-rtdb.firebaseio.com",
            projectId: "ecbusiness-app",
            storageBucket: "ecbusiness-app.firebasestorage.app",
            messagingSenderId: "943619157636",
            appId: "1:943619157636:web:db3d9a507d102b9e34dc04"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        window.onload = () => {
            if(localStorage.getItem('ec_email')) {
                document.getElementById('loginEmail').value = localStorage.getItem('ec_email');
                document.getElementById('loginPass').value = localStorage.getItem('ec_pass');
                document.getElementById('rememberMe').checked = true;
            }
        };

        const app = {
            state: { user: null },

            auth: {
                login: () => {
                    const e = document.getElementById('loginEmail').value;
                    const p = document.getElementById('loginPass').value;
                    if(document.getElementById('rememberMe').checked) {
                        localStorage.setItem('ec_email', e);
                        localStorage.setItem('ec_pass', p);
                    }
                    if(e === 'yamadaki1304@gmail.com' && p === 'Lobosdefg-1') {
                        app.state.user = { nome: 'Admin', role: 'admin' };
                        app.ui.init();
                    } else {
                        db.ref('users').once('value', snap => {
                            let found = null;
                            snap.forEach(c => { if(c.val().email === e && c.val().pass === p) found = c.val(); });
                            if(found) { app.state.user = found; app.ui.init(); }
                            else alert('Acesso negado!');
                        });
                    }
                }
            },

            loans: {
                calc: () => {
                    const v = parseFloat(document.getElementById('loanValue').value) || 0;
                    const r = parseFloat(document.getElementById('loanRate').value) || 0;
                    const total = v + (v * (r / 100));
                    document.getElementById('loanTotal').innerText = total.toLocaleString('pt-BR', {minimumFractionDigits: 2});
                },
                add: () => {
                    const data = {
                        cliente: document.getElementById('loanClient').value,
                        valor: document.getElementById('loanValue').value,
                        taxa: document.getElementById('loanRate').value,
                        prazo: document.getElementById('loanDays').value,
                        whats: document.getElementById('loanWhats').value,
                        total: document.getElementById('loanTotal').innerText,
                        dataCriacao: Date.now(),
                        status: 'pendente'
                    };
                    if(!data.cliente || !data.valor) return alert("Preencha os dados do cliente!");
                    
                    db.ref('loans').push(data);
                    db.ref('logs').push({
                        msg: `Novo Empréstimo: ${data.cliente} - R$ ${data.total}`,
                        user: app.state.user.nome,
                        data: new Date().toLocaleString()
                    });
                    
                    alert('Empréstimo salvo!');
                    document.getElementById('loanClient').value = '';
                    document.getElementById('loanValue').value = '';
                    document.getElementById('loanRate').value = '';
                    document.getElementById('loanDays').value = '';
                    document.getElementById('loanWhats').value = '';
                    document.getElementById('loanTotal').innerText = '0,00';
                },
                markPaid: (id) => {
                    db.ref('loans/' + id).update({ status: 'pago' });
                }
            },

            suppliers: {
                add: () => {
                    const data = {
                        nome: document.getElementById('supName').value,
                        whats: document.getElementById('supWhats').value,
                        pix: document.getElementById('supPix').value,
                        valor: document.getElementById('supValue').value
                    };
                    if(!data.nome) return alert("Informe o nome do fornecedor!");
                    
                    db.ref('suppliers').push(data);
                    db.ref('logs').push({
                        msg: `Novo Fornecedor: ${data.nome} - Valor: R$ ${data.valor}`,
                        user: app.state.user.nome,
                        data: new Date().toLocaleString()
                    });
                    
                    alert('Fornecedor salvo!');
                    document.getElementById('supName').value = '';
                    document.getElementById('supWhats').value = '';
                    document.getElementById('supPix').value = '';
                    document.getElementById('supValue').value = '';
                }
            },

            ui: {
                init: () => {
                    document.getElementById('loginPage').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    document.getElementById('userBadge').innerText = app.state.user.nome.charAt(0);
                    if(app.state.user.role === 'admin') document.getElementById('menuUsuarios').classList.remove('hidden');
                    app.ui.sync();
                },
                nav: (id) => {
                    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                    document.getElementById('content-' + id).classList.add('active');
                    document.getElementById('headerTitle').innerText = id.charAt(0).toUpperCase() + id.slice(1);
                    document.getElementById('mobileSidebar').classList.remove('open');
                },
                sync: () => {
                    // Sincronizar Empréstimos
                    db.ref('loans').on('value', snap => {
                        const now = Date.now();
                        let html = '';
                        snap.forEach(c => {
                            const l = c.val();
                            const id = c.key;
                            const created = l.dataCriacao || now;
                            const dueDate = created + (parseInt(l.prazo || 0) * 86400000);
                            const diff = dueDate - now;
                            const daysLeft = Math.ceil(diff / 86400000);
                            
                            let status = l.status || 'pendente';
                            if(status !== 'pago' && diff < 0) status = 'vencido';

                            // Notificação Android Bridge (2 dias antes)
                            if(status === 'pendente' && daysLeft === 2 && window.Android && window.Android.notify) {
                                window.Android.notify("Aviso EC Business", `O empréstimo de ${l.cliente} vence em 2 dias!`);
                            }

                            const color = status === 'pago' ? 'bg-emerald-100 border-emerald-300' : (status === 'vencido' ? 'bg-red-100 border-red-300' : 'bg-blue-50 border-blue-200');
                            const textColor = status === 'pago' ? 'text-emerald-700' : (status === 'vencido' ? 'text-red-700' : 'text-blue-700');

                            html += `
                            <div class="${color} p-4 rounded-lg border shadow-sm">
                                <div class="flex justify-between items-center mb-1">
                                    <p class="font-bold text-lg text-slate-800">${l.cliente}</p>
                                    <span class="text-xs font-bold uppercase px-2 py-1 rounded bg-white border ${textColor}">${status}</span>
                                </div>
                                <p class="text-sm text-slate-600">Total: <span class="font-bold text-slate-800">R$ ${l.total}</span> | Prazo: ${l.prazo} dias</p>
                                <div class="flex gap-2 mt-3">
                                    ${status !== 'pago' ? `<button onclick="app.loans.markPaid('${id}')" class="flex-1 bg-emerald-600 text-white py-2 rounded-lg text-sm font-bold shadow-sm">Marcar Pago</button>` : ''}
                                    <button onclick="if(confirm('Excluir?')) db.ref('loans/${id}').remove()" class="bg-white text-red-500 border border-red-200 px-4 rounded-lg text-sm"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>`;
                        });
                        document.getElementById('loanList').innerHTML = html || '<p class="text-center text-slate-400 text-sm py-4">Nenhum empréstimo para acompanhar.</p>';
                    });

                    // Sincronizar Fornecedores
                    db.ref('suppliers').on('value', snap => {
                        let html = '';
                        snap.forEach(c => {
                            const i = c.val();
                            html += `
                            <div class="bg-white p-4 border rounded-xl shadow-sm">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <p class="font-bold text-slate-800">${i.nome}</p>
                                        <p class="text-xs text-slate-500">Fornecido: <span class="font-bold text-amber-600">R$ ${i.valor || '0,00'}</span></p>
                                    </div>
                                    <button onclick="if(confirm('Excluir fornecedor?')) db.ref('suppliers/${c.key}').remove()" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-circle-xmark"></i></button>
                                </div>
                                <div class="space-y-1">
                                    <p class="text-sm text-blue-600 font-medium"><i class="fa-brands fa-whatsapp mr-1"></i>${i.whats}</p>
                                    <p class="text-xs break-all bg-slate-50 p-2 rounded border border-dashed font-mono">Pix: ${i.pix}</p>
                                </div>
                            </div>`;
                        });
                        document.getElementById('supList').innerHTML = html || '<p class="text-center text-slate-400 text-sm py-4">Nenhum fornecedor na lista.</p>';
                    });

                    // Sincronizar Histórico (Logs)
                    db.ref('logs').limitToLast(30).on('value', snap => {
                        let html = '';
                        const logs = [];
                        snap.forEach(c => logs.push(c.val()));
                        logs.reverse().forEach(log => {
                            html += `
                            <div class="bg-white p-3 border-l-4 border-emerald-500 rounded shadow-xs mb-2">
                                <p class="text-sm font-medium text-slate-800">${log.msg}</p>
                                <div class="flex justify-between text-[10px] text-slate-400 mt-2 italic">
                                    <span>Resp: ${log.user}</span>
                                    <span>${log.data}</span>
                                </div>
                            </div>`;
                        });
                        document.getElementById('logList').innerHTML = html || '<p class="text-center text-slate-400 text-sm py-4">Nenhuma atividade registrada.</p>';
                    });

                    // Lista de Usuários (Admin)
                    db.ref('users').on('value', snap => {
                        let html = '';
                        snap.forEach(c => {
                            const u = c.val();
                            html += `<div class="bg-white p-3 border rounded-lg flex justify-between items-center shadow-sm">
                                <span class="font-medium text-slate-700">${u.nome} <small class="text-slate-400">(${u.role})</small></span>
                                <button onclick="db.ref('users/${c.key}').remove()" class="text-red-400 hover:text-red-600"><i class="fa-solid fa-trash-can"></i></button>
                            </div>`;
                        });
                        document.getElementById('userList').innerHTML = html;
                    });
                }
            },

            users: { add: () => { 
                const n = document.getElementById('newUserName').value;
                const e = document.getElementById('newUserEmail').value;
                const p = document.getElementById('newUserPass').value;
                const r = document.getElementById('newUserRole').value;
                if(!n || !e || !p) return alert("Preencha todos os campos do usuário!");
                db.ref('users').push({ nome: n, email: e, pass: p, role: r }); 
                alert('Acesso criado!');
                document.getElementById('newUserName').value = '';
                document.getElementById('newUserEmail').value = '';
                document.getElementById('newUserPass').value = '';
            } }
        };
    </script>
</body>
</html>
